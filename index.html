<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
    <title>Curso de Mecânica</title>
</head>

<body>

    <header class="header-container">
        <nav class="nav-bar">
            <img src="./Front-end/assets/img/logo.png" alt="Mecânica na Prática" class="logo-menu">
            <ul class="menu-su">
                <li class="list1"><a href="#">Início</a></li>
                <li class="list"><a href="#">Cursos</a></li>
                <li class="list"><a href="#">Níveis</a></li>
                <li class="list"><a href="#">Biblioteca</a></li>
                <li class="list"><a href="#">Sobre</a></li>
            </ul>
            <div class="button-entrar">
                <div class="lupa"><i class='bx bx-search'></i></div>
                <button type="button" class="Entrar"><i class='bx bx-user'></i>Entrar</button>
            </div>

        </nav>
    </header>
    <hr class="linha">

    <main class="container-box">
        <img src="./Front-end/assets/img/fotofundo.png" alt="Imagem de um carro na mecânica" class="imagem-fundo">
        <section class="conteudo">

            <div class="texto-mecanica">
                <p class="texto-Fut">Seu futuro na mecânica começa aqui</p>
                <h1 class="texto-aprenda">Aprenda mecânica</h1>
                <h1 class="texto-auto">Automotiva do zero</h1>
                <p class="text-avacado">Do básico ao <span class="dest-avançado">avançado</span>, com aulas práticas,
                    passo a passo, mesmo que você nunca mexido em um carro.</p>
            </div>
            <div class="button-comecar">

                <div class="comecar">
                    <button type="button">
                        <i class='bx bx-play'></i>
                        Começar agora
                        <i class='bx bx-right-arrow-alt'></i>
                    </button>           
                </div>

                 <div class="conhecimento">
                    <p>Mais conhecimento, mais oportunidade!</p>
                </div>
                
            </div>
        </section>
    </main>
</body>

</html>
